# W3M configuration — key = value, '#' starts a comment

# colores del tema (nombres X11, ver docs/CONFIG.md)
theme_fg     = black
theme_bg     = grey70
theme_accent = navyblue
wallpaper    = darkslategrey

# barra de tareas propia
show_taskbar = true
taskbar_h    = 24
titlebar_h   = 18

# plugins a cargar (plugins/<name>.lua), separados por comas
plugins = clock,greeter,mem,audio,red,bluetooth,discos

# secciones del panel, en orden izquierda->derecha
# nativas: tasks, clock, date — el resto son slots de plugins
panel_modules = tasks,audio,red,bt,discos,mem,clock,date

# geometria por defecto para ventanas nuevas
window_default_w = 480
window_default_h = 320
